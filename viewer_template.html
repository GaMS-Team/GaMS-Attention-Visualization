<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Viewer</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e3e1dc;
  --hl: #d6d6d6; --accent: #e8590c; --chip: #f0eee9; --avg: #333333;
  --user: #2563eb; --resp: #e8590c; --tmpl: #a3a3a3; --heat: 37, 99, 235;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131315; --panel: #1b1b1e; --ink: #ececef; --muted: #9b9ba1; --line: #2d2d32;
    --hl: #3b3b42; --accent: #ff8a3d; --chip: #26262b; --avg: #dddddd;
    --user: #6ea0ff; --resp: #ff8a3d; --tmpl: #6b6b70; --heat: 110, 160, 255;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button, select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; }
.controls, .heads { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; }
.controls label { display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; }
.seg button.on { background: var(--ink); color: var(--bg); }
#headSwatches { display: flex; flex-wrap: wrap; gap: 3px; }
.sw { width: 26px; height: 22px; border-radius: 4px; border: 2px solid transparent; font-size: 11px; padding: 0; color: #fff; font-weight: 600; }
.sw.off { background: var(--chip) !important; color: var(--muted); }
.sw.avg { width: 34px; }
.hint { font-size: 12px; color: var(--muted); }
main.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 900px) { main.layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 130px; max-height: calc(100vh - 140px); overflow: auto; }
.side h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tokbig { font: 600 20px var(--mono); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 46px; gap: 6px; align-items: center; font-size: 12px; padding: 1px 0; cursor: pointer; }
.bar-row:hover { background: var(--chip); }
.bar-row .t { font-family: var(--mono); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.bar-row .b { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar-row .b > i { display: block; height: 100%; background: var(--accent); }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar-row.actual .t { font-weight: 700; color: var(--accent); }
#promptInfo { margin-bottom: 10px; font-size: 13px; }
#promptInfo .msg { font-family: var(--mono); white-space: pre-wrap; background: var(--chip); border-radius: 6px; padding: 6px 8px; margin-top: 4px; max-height: 6em; overflow: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
/* lines view */
.lines-scroll { overflow: auto; max-height: calc(100vh - 260px); border-top: 1px solid var(--line); }
.lines-inner { position: relative; margin: 8px auto; }
.lines-inner svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.tok { position: absolute; height: 20px; line-height: 20px; font: 13px var(--mono); white-space: pre; overflow: hidden; padding: 0 6px; cursor: pointer; border-radius: 3px; }
.tok.left { text-align: right; border-left: 3px solid transparent; }
.tok.right { text-align: left; border-right: 3px solid transparent; }
.tok.left.user { border-left-color: var(--user); } .tok.right.user { border-right-color: var(--user); }
.tok.left.response { border-left-color: var(--resp); } .tok.right.response { border-right-color: var(--resp); }
.tok.special, .tok.template { color: var(--tmpl); }
.tok.focus { background: var(--hl); }
.boundary { position: absolute; height: 0; border-top: 1px dashed var(--muted); font-size: 10px; color: var(--muted); }
/* text view */
.textview { font: 14px/1.9 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: calc(100vh - 260px); overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.ttok { cursor: pointer; border-radius: 2px; }
.ttok.special { color: var(--tmpl); font-size: 11px; }
.ttok.template { color: var(--tmpl); }
.ttok.focus { outline: 2px solid var(--ink); }
.turn-gap { display: block; height: 8px; }
/* matrix view */
.matrix-wrap { border-top: 1px solid var(--line); padding-top: 8px; }
#mat { display: block; image-rendering: auto; cursor: crosshair; }
#overview { display: block; cursor: pointer; }
#tooltip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); font: 12px var(--mono); padding: 4px 7px; border-radius: 5px; white-space: pre; display: none; max-width: 520px; overflow: hidden; }
.loading { padding: 30px; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="title"><h1>Attention viewer</h1><span id="modelName" class="muted"></span></div>
  <div class="controls">
    <label>Prompt <select id="promptSel"></select></label>
    <label>Layer <button id="layerPrev" title="Previous layer (↑)">◀</button><select id="layerSel"></select><button id="layerNext" title="Next layer (↓)">▶</button></label>
    <div class="seg" id="viewSeg">
      <button data-view="lines">Lines</button><button data-view="text">Text</button><button data-view="matrix">Matrix</button>
    </div>
    <label title="Gemma-style models dump most attention on the <bos> token (attention sink). Hide it and renormalise the remaining weights."><input type="checkbox" id="hideBos" checked> Hide BOS sink</label>
    <label title="Scale colour intensity relative to the strongest weight of the focused row/column"><input type="checkbox" id="rowNorm" checked> Scale to max</label>
    <label>Min weight <input type="range" id="minW" min="0" max="0.3" step="0.005" value="0.02"><span id="minWVal" class="small muted"></span></label>
    <label id="dirWrap">Direction <select id="dirSel"><option value="q">token attends to …</option><option value="k">token is attended by …</option></select></label>
    <label id="colorWrap">Colour <select id="colorMode"><option value="attn">attention</option><option value="prob">token probability</option><option value="entropy">prediction entropy</option></select></label>
  </div>
  <div class="heads"><span class="muted">Heads</span><div id="headSwatches"></div>
    <button id="headsAll">all</button><button id="headsNone">none</button>
    <span class="hint">click: toggle · shift-click / double-click: solo · ↑↓ layer · ←→ token · click a token to pin it</span></div>
</header>

<main class="layout">
  <aside class="side">
    <section class="card" id="tokInfo"></section>
    <section class="card"><h3 id="attnListTitle">Attends most to</h3><div id="attnList"></div></section>
    <section class="card"><h3>Next-token predictions</h3><div id="predInfo"></div></section>
    <section class="card"><h3>Head overview <select id="metricSel"></select></h3>
      <canvas id="overview"></canvas><div id="metricHelp" class="muted small" style="margin-top:6px"></div></section>
  </aside>
  <section class="card">
    <div id="promptInfo"></div>
    <div id="viewBody"></div>
  </section>
</main>
<div id="tooltip"></div>

<script type="application/json" id="data">__DATA_JSON__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const PALETTE = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f",
                 "#bcbd22", "#17becf", "#393b79", "#e6550d", "#31a354", "#ad494a", "#6b6ecf", "#d6616b"];
const METRICS = {
  resp_to_prompt: "Mean attention mass from answer tokens to prompt tokens.",
  resp_to_resp: "Mean attention mass from answer tokens to earlier answer tokens.",
  to_user: "Mean attention mass on the user message tokens.",
  previous: "Mean attention to the immediately preceding token (previous-token heads).",
  self: "Mean attention of a token to itself.",
  bos: "Mean attention on the first <bos> token (attention sink).",
  distance: "Mean attention-weighted distance (in tokens) between query and key.",
  entropy: "Mean entropy of the attention distribution (high = diffuse).",
};
const ROW = 20, COLW = 190, GAP = 260;

const state = {
  p: 0, layer: 0, heads: new Set(), view: "lines", hideBos: true, rowNorm: true, minW: 0.02,
  colorMode: "attn", dir: "q", pinned: null, hover: null, metric: "resp_to_prompt",
};
const cache = new Map();
let LD = null;            // decoded data of the current (prompt, layer)
let built = null;         // key of the built view
let els = {};             // DOM refs of the built view

const $ = (id) => document.getElementById(id);
const P = () => DATA.prompts[state.p];
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function disp(t) {
  if (t === "") return "∅";
  if (/^\s+$/.test(t)) return t.replace(/\n/g, "↵").replace(/\t/g, "⇥").replace(/ /g, "␣");
  return t.replace(/\n/g, "↵").replace(/\t/g, "⇥");
}
function headColor(h) { return h === P().n_heads ? cssVar("--avg") : PALETTE[h % PALETTE.length]; }
function hexRgb(c) {
  if (c.startsWith("#")) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  const m = c.match(/\d+/g); return m ? m.slice(0, 3).map(Number) : [0, 0, 0];
}
function rgba(c, a) { const [r, g, b] = hexRgb(c); return `rgba(${r},${g},${b},${a.toFixed(3)})`; }
const current = () => state.hover || state.pinned;
const selHeads = () => [...state.heads].sort((a, b) => a - b);
function focusColor() { const hs = selHeads(); return hs.length === 1 ? headColor(hs[0]) : cssVar("--accent"); }

// ---------------------------------------------------------------- data decoding
function b64ToBytes(b64) { const bin = atob(b64); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function gunzip(bytes) {
  if (typeof DecompressionStream === "undefined") throw new Error("This browser lacks DecompressionStream; use a recent Chrome/Firefox/Safari.");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).arrayBuffer();
}
function loadLayer(p, l) {
  const key = p + ":" + l;
  if (!cache.has(key)) cache.set(key, (async () => {
    const ent = DATA.prompts[p].layers[l];
    const buf = await gunzip(b64ToBytes(ent.b64));
    let o = 0;
    const off = new Uint32Array(buf.slice(o, o + 4 * ent.n_off)); o += 4 * ent.n_off;
    const bosQ = new Uint16Array(buf.slice(o, o + 2 * ent.n_bos)); o += 2 * ent.n_bos;
    const key16 = new Uint16Array(buf.slice(o, o + 2 * ent.nnz)); o += 2 * ent.nnz;
    const w8 = new Uint8Array(buf.slice(o, o + ent.nnz));
    const w = new Float32Array(ent.nnz);
    for (let i = 0; i < ent.nnz; i++) { const s = w8[i] / 255; w[i] = s * s; }   // sqrt-quantised
    const bos = new Float32Array(ent.n_bos);
    for (let i = 0; i < ent.n_bos; i++) bos[i] = bosQ[i] / 65535;
    return { off, key: key16, w, bos };
  })());
  return cache.get(key);
}

// row = attention distribution of query q in head h (sparse)
function getRow(h, q) {
  const L = P().seq_len, r = h * L + q, s = LD.off[r], e = LD.off[r + 1];
  let scale = 1;
  if (state.hideBos) { const b = LD.bos[r]; scale = b < 0.9999 ? 1 / (1 - b) : 0; }
  const ks = [], ws = [];
  for (let i = s; i < e; i++) {
    const k = LD.key[i];
    if (state.hideBos && k === 0) continue;
    ks.push(k); ws.push(LD.w[i] * scale);
  }
  return { ks, ws };
}
// vector over all tokens for a focus (side q: what idx attends to; side k: who attends to idx)
function headVector(h, f) {
  const L = P().seq_len, v = new Float32Array(L);
  if (f.side === "q") { const { ks, ws } = getRow(h, f.idx); for (let i = 0; i < ks.length; i++) v[ks[i]] = ws[i]; }
  else {
    for (let q = f.idx; q < L; q++) {
      const { ks, ws } = getRow(h, q);
      for (let i = 0; i < ks.length; i++) if (ks[i] === f.idx) { v[q] = ws[i]; break; }
    }
  }
  return v;
}
function meanVector(f) {
  const L = P().seq_len, hs = selHeads(), v = new Float32Array(L);
  if (!hs.length || !f) return v;
  for (const h of hs) { const hv = headVector(h, f); for (let i = 0; i < L; i++) v[i] += hv[i] / hs.length; }
  return v;
}
const vmax = (v) => { let m = 0; for (const x of v) if (x > m) m = x; return m; };

// ---------------------------------------------------------------- controls
function initControls() {
  $("modelName").textContent = DATA.model;
  $("promptSel").innerHTML = DATA.prompts.map((p, i) => `<option value="${i}">${i + 1}. ${esc(p.title)}</option>`).join("");
  $("promptSel").onchange = (e) => setPrompt(+e.target.value);
  $("layerSel").onchange = (e) => setLayer(+e.target.value);
  $("layerPrev").onclick = () => setLayer(Math.max(0, state.layer - 1));
  $("layerNext").onclick = () => setLayer(Math.min(P().layers.length - 1, state.layer + 1));
  document.querySelectorAll("#viewSeg button").forEach((b) => b.onclick = () => { state.view = b.dataset.view; render(); });
  $("hideBos").onchange = (e) => { state.hideBos = e.target.checked; render(); };
  $("rowNorm").onchange = (e) => { state.rowNorm = e.target.checked; render(); };
  $("minW").oninput = (e) => { state.minW = +e.target.value; $("minWVal").textContent = state.minW.toFixed(3); render(); };
  $("minWVal").textContent = state.minW.toFixed(3);
  $("dirSel").onchange = (e) => { state.dir = e.target.value; if (state.pinned) state.pinned.side = state.dir; render(); };
  $("colorMode").onchange = (e) => { state.colorMode = e.target.value; render(); };
  $("headsAll").onclick = () => { state.heads = new Set([...Array(P().n_heads).keys()]); render(); };
  $("headsNone").onclick = () => { state.heads = new Set(); render(); };
  $("metricSel").innerHTML = Object.keys(METRICS).map((m) => `<option value="${m}">${m.replace(/_/g, " ")}</option>`).join("");
  $("metricSel").value = state.metric;
  $("metricSel").onchange = (e) => { state.metric = e.target.value; drawOverview(); };
  initOverviewEvents();
  document.addEventListener("keydown", (e) => {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    const L = P().seq_len;
    if (e.key === "ArrowUp") { e.preventDefault(); setLayer(Math.max(0, state.layer - 1)); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setLayer(Math.min(P().layers.length - 1, state.layer + 1)); }
    else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && state.pinned) {
      e.preventDefault();
      state.pinned = { ...state.pinned, idx: Math.max(0, Math.min(L - 1, state.pinned.idx + (e.key === "ArrowLeft" ? -1 : 1))) };
      state.hover = null; drawFocus(true);
    }
  });
}

function buildSwatches() {
  const H = P().n_heads;
  const box = $("headSwatches"); box.innerHTML = "";
  for (let h = 0; h <= H; h++) {
    const b = document.createElement("button");
    b.className = "sw" + (h === H ? " avg" : "");
    b.textContent = h === H ? "avg" : h;
    b.title = h === H ? "Mean over all heads (exact)" : `Head ${h}`;
    b.onclick = (e) => {
      if (e.shiftKey) state.heads = new Set([h]);
      else if (state.heads.has(h)) state.heads.delete(h); else state.heads.add(h);
      render();
    };
    b.ondblclick = () => { state.heads = new Set([h]); render(); };
    box.appendChild(b);
  }
}
function updateSwatches() {
  const H = P().n_heads;
  [...$("headSwatches").children].forEach((b, h) => {
    const on = state.heads.has(h);
    b.classList.toggle("off", !on);
    b.style.background = headColor(h);
    b.style.color = !on ? "" : h === H ? cssVar("--bg") : "#fff";
  });
}

function setPrompt(p) {
  state.p = p; built = null;
  const pr = P();
  state.heads = new Set([...Array(pr.n_heads).keys()]);
  state.pinned = { idx: Math.min(pr.prompt_len, pr.seq_len - 1), side: "q" };
  state.hover = null;
  $("layerSel").innerHTML = pr.layer_ids.map((lid, i) =>
    `<option value="${i}">${lid} · ${pr.layer_types[lid] === "full_attention" ? "global" : "local"}</option>`).join("");
  buildSwatches();
  const nUser = pr.segments.filter((s) => s === "user").length;
  $("promptInfo").innerHTML =
    `<div><b>${esc(pr.title)}</b> <span class="muted small">· ${esc(pr.source)} · ${pr.prompt_len} prompt tokens (${nUser} user) · ${pr.seq_len - pr.prompt_len} generated tokens · ${pr.n_layers} layers × ${pr.n_heads} heads</span></div>
     <div class="msg">${esc(pr.user_message)}</div>
     <div class="legend"><span><i style="background:var(--user)"></i>user message</span><span><i style="background:var(--resp)"></i>model answer</span><span><i style="background:var(--tmpl)"></i>chat template / special</span></div>`;
  setLayer(Math.floor(pr.layers.length / 2));
}

async function setLayer(l) {
  state.layer = l;
  $("layerSel").value = l;
  const p = state.p;
  if (!cache.has(p + ":" + l)) $("viewBody").innerHTML = `<div class="loading">Decoding layer…</div>`, built = null;
  const data = await loadLayer(p, l);
  if (state.p !== p || state.layer !== l) return;
  LD = data;
  render();
}

// ---------------------------------------------------------------- rendering
function render() {
  if (!LD) return;
  document.querySelectorAll("#viewSeg button").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  $("dirWrap").style.display = state.view === "lines" ? "none" : "";
  $("colorWrap").style.display = state.view === "text" ? "" : "none";
  if (state.view !== "lines" && state.pinned) state.pinned.side = state.dir;
  updateSwatches();
  const key = state.p + ":" + state.view;
  if (built !== key) {
    if (state.view === "lines") buildLines(); else if (state.view === "text") buildText(); else buildMatrix();
    built = key; els.matKey = null;
  }
  drawFocus(false);
  drawOverview();
}
function drawFocus(scroll) {
  if (state.view === "lines") drawLines(scroll); else if (state.view === "text") drawText(scroll); else drawMatrix();
  renderInfo();
}
function setHover(f) {
  const c = state.hover;
  if ((c && f && c.idx === f.idx && c.side === f.side) || (!c && !f)) return;
  state.hover = f; drawFocus(false);
}
function pin(f) { state.pinned = f; state.hover = null; drawFocus(false); }
function tokClass(i) { return P().segments[i]; }

// ---- lines (BertViz-like)
function buildLines() {
  const pr = P(), L = pr.seq_len, W = COLW * 2 + GAP;
  const body = $("viewBody"); body.innerHTML = "";
  const scroll = document.createElement("div"); scroll.className = "lines-scroll";
  const inner = document.createElement("div"); inner.className = "lines-inner";
  inner.style.width = W + "px"; inner.style.height = (L * ROW + 16) + "px";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", L * ROW + 16);
  inner.appendChild(svg);
  const left = [], right = [];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < L; i++) {
    const t = disp(pr.tokens[i]);
    for (const side of ["left", "right"]) {
      const d = document.createElement("div");
      d.className = `tok ${side} ${tokClass(i)}`;
      d.style.top = (i * ROW) + "px"; d.style.width = COLW + "px";
      d.style.left = (side === "left" ? 0 : COLW + GAP) + "px";
      d.textContent = t; d.dataset.i = i; d.dataset.side = side === "left" ? "k" : "q";
      frag.appendChild(d); (side === "left" ? left : right).push(d);
    }
  }
  inner.appendChild(frag);
  if (pr.prompt_len < L) {
    const b = document.createElement("div"); b.className = "boundary";
    b.style.top = (pr.prompt_len * ROW) + "px"; b.style.left = "0"; b.style.width = W + "px";
    inner.appendChild(b);
  }
  inner.addEventListener("mouseover", (e) => { const t = e.target.closest(".tok"); if (t) setHover({ idx: +t.dataset.i, side: t.dataset.side }); });
  inner.addEventListener("mouseleave", () => setHover(null));
  inner.addEventListener("click", (e) => { const t = e.target.closest(".tok"); if (t) pin({ idx: +t.dataset.i, side: t.dataset.side }); });
  scroll.appendChild(inner); body.appendChild(scroll);
  els = { svg, left, right, scroll, prevFocus: [] };
}
function drawLines(scroll) {
  const f = current(); if (!f) return;
  const pr = P(), L = pr.seq_len, hs = selHeads(), n = hs.length;
  els.prevFocus.forEach((d) => d.classList.remove("focus"));
  const fe = (f.side === "q" ? els.right : els.left)[f.idx]; fe.classList.add("focus"); els.prevFocus = [fe];
  let s = "";
  const yc = (i) => i * ROW + ROW / 2;
  hs.forEach((h, hi) => {
    const c = headColor(h), v = headVector(h, f), m = vmax(v) || 1;
    const stripW = COLW / n, stripX = f.side === "q" ? hi * stripW : COLW + GAP + hi * stripW;
    for (let j = 0; j < L; j++) {
      const w = v[j]; if (w < state.minW || w <= 0) continue;
      const a = Math.min(1, state.rowNorm ? w / m : w);
      const [kk, qq] = f.side === "q" ? [j, f.idx] : [f.idx, j];
      s += `<line x1="${COLW}" y1="${yc(kk)}" x2="${COLW + GAP}" y2="${yc(qq)}" stroke="${c}" stroke-opacity="${a.toFixed(3)}" stroke-width="2"/>`;
      s += `<rect x="${stripX.toFixed(1)}" y="${j * ROW}" width="${stripW.toFixed(1)}" height="${ROW}" fill="${c}" fill-opacity="${(a * 0.75).toFixed(3)}"/>`;
    }
  });
  els.svg.innerHTML = s;
  if (scroll) fe.scrollIntoView({ block: "nearest" });
}

// ---- text heatmap
function buildText() {
  const pr = P(), L = pr.seq_len;
  const body = $("viewBody"); body.innerHTML = "";
  const box = document.createElement("div"); box.className = "textview";
  const spans = [];
  for (let i = 0; i < L; i++) {
    const sp = document.createElement("span");
    const seg = pr.segments[i];
    sp.className = "ttok " + seg; sp.dataset.i = i;
    sp.textContent = pr.tokens[i];
    if (i === pr.prompt_len) { const g = document.createElement("span"); g.className = "turn-gap"; box.appendChild(g); }
    box.appendChild(sp); spans.push(sp);
  }
  box.addEventListener("mouseover", (e) => { const t = e.target.closest(".ttok"); if (t) setHover({ idx: +t.dataset.i, side: state.dir }); });
  box.addEventListener("mouseleave", () => setHover(null));
  box.addEventListener("click", (e) => { const t = e.target.closest(".ttok"); if (t) pin({ idx: +t.dataset.i, side: state.dir }); });
  body.appendChild(box);
  els = { spans, box, prev: null };
}
function drawText(scroll) {
  const f = current(); if (!f) return;
  const pr = P(), L = pr.seq_len;
  let vals, color;
  if (state.colorMode === "attn") {
    vals = meanVector(f); color = focusColor();
    const m = vmax(vals) || 1;
    for (let i = 0; i < L; i++) vals[i] = vals[i] < state.minW ? 0 : Math.min(1, state.rowNorm ? vals[i] / m : vals[i]);
  } else if (state.colorMode === "prob") {
    color = "#d62728"; vals = pr.target_prob.map((p) => (p == null ? 0 : 1 - p));
  } else {
    color = "#7c3aed"; const ent = pr.entropy, m = Math.max(...ent) || 1;
    vals = pr.tokens.map((_, i) => (i === 0 ? 0 : ent[i - 1] / m));
  }
  for (let i = 0; i < L; i++) els.spans[i].style.background = vals[i] > 0.004 ? rgba(color, vals[i] * 0.85) : "";
  if (els.prev != null) els.spans[els.prev].classList.remove("focus");
  els.spans[f.idx].classList.add("focus"); els.prev = f.idx;
  if (scroll) els.spans[f.idx].scrollIntoView({ block: "nearest" });
}

// ---- attention matrix
function buildMatrix() {
  const body = $("viewBody"); body.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "matrix-wrap";
  const note = document.createElement("div"); note.className = "muted small";
  note.textContent = "Rows = queries (attending token), columns = keys (attended token). Dashed lines mark where the answer starts. Hover for details, click to pin a query.";
  const cv = document.createElement("canvas"); cv.id = "mat";
  wrap.appendChild(note); wrap.appendChild(cv); body.appendChild(wrap);
  const pos = (e) => {
    const r = cv.getBoundingClientRect(), L = P().seq_len, S = els.S;
    const x = e.clientX - r.left - els.pad, y = e.clientY - r.top - els.pad;
    if (x < 0 || y < 0 || x >= S || y >= S) return null;
    return { q: Math.floor(y / S * L), k: Math.floor(x / S * L) };
  };
  cv.addEventListener("mousemove", (e) => {
    const p = pos(e); if (!p) { hideTip(); return; }
    const pr = P();
    const v = meanVector({ idx: p.q, side: "q" });
    showTip(e, `q ${p.q} ${disp(pr.tokens[p.q])}  →  k ${p.k} ${disp(pr.tokens[p.k])}\nweight ${v[p.k].toFixed(4)}`);
    setHover({ idx: p.q, side: "q" });
  });
  cv.addEventListener("mouseleave", () => { hideTip(); setHover(null); });
  cv.addEventListener("click", (e) => { const p = pos(e); if (p) pin({ idx: p.q, side: "q" }); });
  els = { cv, matKey: null, off: null, S: 0, pad: 28 };
}
function computeMatrix() {
  const pr = P(), L = pr.seq_len, hs = selHeads();
  const key = [state.p, state.layer, hs.join(","), state.hideBos, state.rowNorm, state.minW, focusColor()].join("|");
  if (els.matKey === key) return;
  const off = document.createElement("canvas"); off.width = L; off.height = L;
  const ctx = off.getContext("2d"), img = ctx.createImageData(L, L);
  const [r, g, b] = hexRgb(focusColor());
  const acc = new Float32Array(L);
  for (let q = 0; q < L; q++) {
    acc.fill(0);
    for (const h of hs) { const { ks, ws } = getRow(h, q); for (let i = 0; i < ks.length; i++) acc[ks[i]] += ws[i] / hs.length; }
    const m = vmax(acc) || 1;
    for (let k = 0; k <= q; k++) {
      const v = acc[k]; if (v < state.minW || v <= 0) continue;
      const a = Math.pow(Math.min(1, state.rowNorm ? v / m : v), 0.6);
      const o = (q * L + k) * 4; img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  els.off = off; els.matKey = key;
}
function drawMatrix() {
  computeMatrix();
  const pr = P(), L = pr.seq_len, cv = els.cv, pad = els.pad;
  const avail = Math.max(240, Math.min(cv.parentElement.clientWidth - 2 * pad, window.innerHeight - 300));
  const S = Math.floor(avail), dpr = window.devicePixelRatio || 1;
  els.S = S;
  cv.width = (S + 2 * pad) * dpr; cv.height = (S + 2 * pad) * dpr;
  cv.style.width = (S + 2 * pad) + "px"; cv.style.height = (S + 2 * pad) + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = cssVar("--panel"); ctx.fillRect(0, 0, S + 2 * pad, S + 2 * pad);
  ctx.strokeStyle = cssVar("--line"); ctx.strokeRect(pad - 0.5, pad - 0.5, S + 1, S + 1);
  ctx.imageSmoothingEnabled = L * dpr > S * dpr;
  ctx.drawImage(els.off, pad, pad, S, S);
  const cell = S / L;
  ctx.setLineDash([4, 3]); ctx.strokeStyle = cssVar("--muted"); ctx.lineWidth = 1;
  if (pr.prompt_len < L) {
    const z = pad + pr.prompt_len * cell;
    ctx.beginPath(); ctx.moveTo(pad, z); ctx.lineTo(pad + S, z); ctx.moveTo(z, pad); ctx.lineTo(z, pad + S); ctx.stroke();
  }
  ctx.setLineDash([]);
  const f = current();
  if (f) {
    ctx.strokeStyle = cssVar("--ink"); ctx.lineWidth = 1.5;
    const z = f.idx * cell;
    if (f.side === "q") ctx.strokeRect(pad, pad + z, S, Math.max(cell, 1.5)); else ctx.strokeRect(pad + z, pad, Math.max(cell, 1.5), S);
  }
  ctx.fillStyle = cssVar("--muted"); ctx.font = "11px " + cssVar("--sans");
  ctx.fillText("keys →", pad, pad - 8);
  ctx.save(); ctx.translate(pad - 8, pad); ctx.rotate(Math.PI / 2); ctx.fillText("queries →", 0, 0); ctx.restore();
}

// ---- side panel
function barRow(text, val, max, cls, idx) {
  return `<div class="bar-row ${cls || ""}" ${idx != null ? `data-i="${idx}"` : ""}><span class="t">${esc(text)}</span>` +
    `<span class="b"><i style="width:${(100 * val / (max || 1)).toFixed(1)}%"></i></span><span class="v">${val.toFixed(3)}</span></div>`;
}
function renderInfo() {
  const f = current(); if (!f) return;
  const pr = P(), i = f.idx, lid = pr.layer_ids[state.layer];
  const p = pr.target_prob[i];
  let rankTxt = "";
  if (i > 0) {
    const r = pr.predictions[i - 1].findIndex((x) => x[0] === pr.tokens[i]);
    rankTxt = r >= 0 ? ` (rank ${r + 1})` : ` (not in top ${pr.predictions[i - 1].length})`;
  }
  $("tokInfo").innerHTML =
    `<div class="tokbig" title="${esc(pr.pieces[i])}">${esc(disp(pr.tokens[i]))}</div>
     <div class="muted small">position ${i} · ${pr.segments[i]} · id ${pr.token_ids[i]} · piece <code>${esc(pr.pieces[i])}</code></div>
     ${p != null ? `<div class="small" style="margin-top:4px">p(token | prefix) = <b>${(100 * p).toFixed(2)}%</b>${rankTxt}</div>` : ""}
     <div class="muted small" style="margin-top:4px">${state.pinned && !state.hover ? "pinned" : "hover"} · layer ${lid} (${pr.layer_types[lid] === "full_attention" ? "global" : "sliding-window"}) · ${f.side === "q" ? "as query" : "as key"}</div>`;

  const hs = selHeads();
  $("attnListTitle").textContent = (f.side === "q" ? "Attends most to" : "Most attended by") + (hs.length === 1 ? ` (head ${hs[0] === pr.n_heads ? "avg" : hs[0]})` : ` (mean of ${hs.length} heads)`);
  const v = meanVector(f);
  const top = [...v.keys()].filter((j) => v[j] > 0).sort((a, b) => v[b] - v[a]).slice(0, 12);
  const m = top.length ? v[top[0]] : 1;
  $("attnList").innerHTML = top.length
    ? top.map((j) => barRow(`${disp(pr.tokens[j])}  #${j}`, v[j], m, "", j)).join("")
    : `<div class="muted small">No weights above threshold (select heads or lower min weight).</div>`;
  $("attnList").querySelectorAll(".bar-row").forEach((r) => r.onclick = () => { pin({ idx: +r.dataset.i, side: f.side }); });

  let h = "";
  if (i > 0) {
    const preds = pr.predictions[i - 1];
    h += `<div class="muted small">Before this token the model expected:</div>` +
      preds.map(([t, pp]) => barRow(disp(t), pp, preds[0][1], t === pr.tokens[i] ? "actual" : "")).join("");
  }
  if (i < pr.seq_len - 1) {
    const preds = pr.predictions[i].slice(0, 5);
    h += `<div class="muted small" style="margin-top:8px">After this token (next-token distribution, entropy ${pr.entropy[i].toFixed(2)} nats):</div>` +
      preds.map(([t, pp]) => barRow(disp(t), pp, preds[0][1], t === pr.tokens[i + 1] ? "actual" : "")).join("");
  }
  $("predInfo").innerHTML = h;
}

// ---- head overview (layers × heads)
const OV = { cw: 14, ch: 9, padL: 30, padT: 16 };
function drawOverview() {
  const pr = P(), cv = $("overview"), H = pr.n_heads + 1, NL = pr.layers.length;
  const W = OV.padL + H * OV.cw + 2, Hh = OV.padT + NL * OV.ch + 2, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = Hh * dpr; cv.style.width = W + "px"; cv.style.height = Hh + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, Hh);
  const vals = pr.head_stats[state.metric];
  let mn = Infinity, mx = -Infinity;
  vals.forEach((r) => r.forEach((x) => { mn = Math.min(mn, x); mx = Math.max(mx, x); }));
  const heat = cssVar("--heat");
  for (let l = 0; l < NL; l++) for (let h = 0; h < H; h++) {
    const a = mx > mn ? (vals[l][h] - mn) / (mx - mn) : 0;
    ctx.fillStyle = `rgba(${heat},${(0.05 + 0.95 * a).toFixed(3)})`;
    ctx.fillRect(OV.padL + h * OV.cw + (h === H - 1 ? 2 : 0), OV.padT + l * OV.ch, OV.cw - 1, OV.ch - 1);
  }
  ctx.font = "9px " + cssVar("--sans"); ctx.fillStyle = cssVar("--muted"); ctx.textAlign = "right";
  for (let l = 0; l < NL; l++) {
    const lid = pr.layer_ids[l];
    if (pr.layer_types[lid] === "full_attention") { ctx.fillStyle = cssVar("--accent"); ctx.fillRect(OV.padL - 5, OV.padT + l * OV.ch + 2, 3, OV.ch - 5); ctx.fillStyle = cssVar("--muted"); }
    if (l % 4 === 0 || l === NL - 1) ctx.fillText(lid, OV.padL - 8, OV.padT + l * OV.ch + OV.ch - 1);
  }
  ctx.textAlign = "center";
  for (let h = 0; h < H; h++) if (h % 3 === 0 || h === H - 1) ctx.fillText(h === H - 1 ? "avg" : h, OV.padL + h * OV.cw + OV.cw / 2 + (h === H - 1 ? 2 : 0), OV.padT - 5);
  ctx.strokeStyle = cssVar("--ink"); ctx.lineWidth = 1.5;
  ctx.strokeRect(OV.padL - 0.5, OV.padT + state.layer * OV.ch - 0.5, H * OV.cw + 2, OV.ch);
  for (const h of state.heads) { ctx.fillStyle = cssVar("--ink"); ctx.fillRect(OV.padL + h * OV.cw + (h === H - 1 ? 2 : 0), OV.padT - 3, OV.cw - 1, 2); }
  $("metricHelp").innerHTML = `${METRICS[state.metric]} Range ${mn.toFixed(3)} – ${mx.toFixed(3)}. <span style="color:var(--accent)">▌</span> = global-attention layer. Click a cell to jump to that layer/head.`;
}
function initOverviewEvents() {
  const cv = $("overview");
  const cellAt = (e) => {
    const r = cv.getBoundingClientRect(), pr = P(), H = pr.n_heads + 1;
    const x = e.clientX - r.left - OV.padL, y = e.clientY - r.top - OV.padT;
    const l = Math.floor(y / OV.ch); let h = Math.floor(x / OV.cw);
    if (h >= H) h = H - 1;
    if (x < 0 || y < 0 || l >= pr.layers.length) return null;
    return { l, h };
  };
  cv.addEventListener("mousemove", (e) => {
    const c = cellAt(e); if (!c) { hideTip(); return; }
    const pr = P();
    showTip(e, `layer ${pr.layer_ids[c.l]} · ${c.h === pr.n_heads ? "avg" : "head " + c.h}\n${state.metric}: ${pr.head_stats[state.metric][c.l][c.h].toFixed(4)}`);
  });
  cv.addEventListener("mouseleave", hideTip);
  cv.addEventListener("click", (e) => { const c = cellAt(e); if (!c) return; state.heads = new Set([c.h]); setLayer(c.l); });
}

// ---- tooltip
function showTip(e, text) { const t = $("tooltip"); t.textContent = text; t.style.display = "block"; t.style.left = (e.clientX + 14) + "px"; t.style.top = (e.clientY + 14) + "px"; }
function hideTip() { $("tooltip").style.display = "none"; }

window.addEventListener("resize", () => { if (state.view === "matrix" && LD) drawMatrix(); });
initControls();
setPrompt(0);
</script>
</body>
